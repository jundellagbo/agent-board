name: Release

# Installers are built where they are installed: cross-compiling a webview app
# is not worth the trouble, so each platform builds its own on a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default token is read-only, and publishing a release writes to the repo.
permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ""
          - platform: ubuntu-22.04-arm
            target: ""
          - platform: windows-latest
            target: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev build-essential curl wget file libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A mac runner is Apple Silicon, so the Intel build has to have its target
      # installed — one field drives both it and the build flag, which is what
      # the two used to disagree about.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run verify

      # A tag publishes a draft release with every installer attached; a manual
      # run only builds, and the installers come back as workflow artifacts.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Agent Board ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # .deb/.rpm/.AppImage, .exe/.msi, .app/.dmg — whatever this runner made.
      - uses: actions/upload-artifact@v4
        with:
          name: agent-board-${{ matrix.platform }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          if-no-files-found: error
