[package]
name = "agent-board"
version = "0.2.1"
description = "Desktop Kanban board that runs coding agents"
authors = ["Agent Board"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "agent_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
memchr = "2"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.20.0", features = ["v4"] }
thiserror = "2.0.20"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2.7.3"
portable-pty = "0.9.0"
base64 = "0.23.1"
shell-words = "1.1.1"
tauri-plugin-notification = "2.4.0"
ureq = { version = "3.2.1", default-features = false, features = ["rustls", "json"] }
tauri-plugin-single-instance = "2.4.4"
notify = "8.2.0"

[dev-dependencies]
# Mock runtime so pty streaming can be tested without a window.
tauri = { version = "2.11.3", features = ["test"] }
